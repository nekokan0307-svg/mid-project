<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FITBEAT Phone Controller</title><link rel="stylesheet" href="style.css"><style>.phone{max-width:480px;margin:15px auto;text-align:center;padding:24px;background:#fff4df;border:4px solid #52362f;border-radius:28px}.phone .puppy{width:170px}.sensor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.sensor-grid>div{border:3px solid #52362f;background:#f5dbea;border-radius:16px;padding:12px}.sensor-grid b{display:block;font-size:1.7rem}.phone button{margin:6px}.notice{font-size:.9rem;background:#ffe9b3;padding:10px;border-radius:12px}</style></head><body><div class="phone"><h1>🌸 FITBEAT</h1><h2 style="font-size:1.5rem;margin:0">Tilt, Move, Dance!</h2><img class="puppy idle" src="assets/puppy.svg" alt="Puppy"><p id="status">📱 Motion permission not requested</p><div class="sensor-grid"><div>Tilt Left / Right<b id="lr">—</b></div><div>Forward / Back<b id="fb">—</b></div><div>Rotation<b id="rot">—</b></div><div>Motion<b id="acc">—</b></div></div><button id="enable">🌼 Enable Motion</button><button id="calibrate">Calibrate</button><p class="notice">This page reads iPhone sensors locally. Connecting it to the computer game is planned for the next step; it does not control the game yet.</p><p><a href="index.html">← Back to game</a></p></div><script src="controller.js"></script></body></html>
