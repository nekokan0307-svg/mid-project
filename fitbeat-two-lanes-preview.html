<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FITBEAT · Two Arms</title><link rel="stylesheet" href="style.css"><style>body{font-family:system-ui}.wrap{max-width:780px;margin:20px auto;padding:20px;text-align:center;background:#fff3e4;border:4px solid #70505c;border-radius:25px}.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:390px}.lane{position:relative;overflow:hidden;border:3px solid #70505c;border-radius:20px;background:#ffe0e9}.lane:nth-child(2){background:#dbeeff}.lane h2{font-size:1.2rem}.hit{position:absolute;top:78%;width:100%;border-top:6px dashed #8e568c}.note{position:absolute;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:white;border:4px solid #b785a8;display:grid;place-items:center;font-size:32px}.wrap button{margin:7px}.hint{font-size:14px}</style><div class="wrap"><h1>🌼 FITBEAT</h1><p>Two-Arm Rhythm Preview</p><p>Score <b id="score">0</b> · Combo <b id="combo">0</b> · <b id="time">60</b>s</p><div class="board"><div class="lane" id="left"><h2>🌸 LEFT ARM</h2><div class="hit"></div></div><div class="lane" id="right"><h2>🌼 RIGHT ARM</h2><div class="hit"></div></div></div><p id="msg">กด Start เพื่อทดลอง</p><button id="start">▶ Start</button><button id="stop">■ Stop</button><p class="hint">กดปุ่ม 1 ยก / 2 กาง / 3 ลด / 4 ยื่น แขนซ้าย<br>Q ยก / W กาง / E ลด / R ยื่น แขนขวา</p><p><a href="./">กลับเกมหลัก</a></p></div><script>const $=id=>document.getElementById(id),types=['↑','↔','↓','→'];let playing=false,notes=[],frame=0,started=0,next=0,count=0,score=0,combo=0;function loop(){if(!playing)return;const t=(performance.now()-started)/1000;$('time').textContent=Math.max(0,Math.ceil(60-t));while(t>=next){const side=Math.floor(count/4)%2?'right':'left',pose=count%4,el=document.createElement('div');el.className='note';el.textContent=types[pose];$(side).append(el);notes.push({side,pose,at:next,el});next+=2.7;count++}for(const n of notes){const p=(t-n.at)/3.4;n.el.style.top=(12+p*66)+'%';if(p>1.24){n.el.remove();n.miss=true;combo=0;$('combo').textContent=0;$('msg').textContent='MISS'}}notes=notes.filter(n=>!n.miss);if(t>60){playing=false;$('msg').textContent='Finished! Score '+score;return}frame=requestAnimationFrame(loop)}function hit(side,pose){if(!playing)return;const t=(performance.now()-started)/1000,n=notes.find(n=>n.side===side&&n.pose===pose&&Math.abs(t-n.at-3.4)<.7);if(!n)return;n.el.remove();notes.splice(notes.indexOf(n),1);combo++;score+=100+combo*5;$('score').textContent=score;$('combo').textContent=combo;$('msg').textContent='PERFECT! ✨'}$('start').onclick=()=>{playing=false;cancelAnimationFrame(frame);notes.forEach(n=>n.el.remove());notes=[];next=count=score=combo=0;$('score').textContent=$('combo').textContent=0;started=performance.now();playing=true;$('msg').textContent='GO!';loop()};$('stop').onclick=()=>{playing=false;cancelAnimationFrame(frame);$('msg').textContent='Stopped'};document.onkeydown=e=>{const keys={Digit1:['left',0],Digit2:['left',1],Digit3:['left',2],Digit4:['left',3],KeyQ:['right',0],KeyW:['right',1],KeyE:['right',2],KeyR:['right',3]};if(keys[e.code])hit(...keys[e.code])}</script>
